[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "room-robot-v5-four-weeks"
version = "0.5.0"
description = "Four-week RF2O/Nav2 mobile robot project with semantic perception, local planning and evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
ml = ["torch>=2.4,<3"]
test = ["pytest>=8,<10"]
perception = ["torch>=2.6,<3", "transformers==4.52.3", "safetensors>=0.4.3"]
eval = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["learning_nav*", "robot_extras*", "room_semantics*", "room_planning*", "room_evaluation*"]
exclude = ["legacy_v2*", "ros2_ws*", "tests*"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests", "learning_nav/tests", "ros2_ws/src/room_nav/test", "ros2_ws/src/room_base/test", "ros2_ws/src/room_sim/test"]
