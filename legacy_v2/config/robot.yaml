# EXAMPLE NUMBERS: measure your robot and camera before confirming calibration.
# The shipped configuration cannot actuate a motor.
runtime:
  allow_actuation: false
  allow_camera_only_research: false
  calibration_confirmed: false
  world_model_validated: false
  allow_wm_trials: false
  world_model_sha256: ""
  world_model_trial_file: calibration/wm_trial_eligibility.json
  world_model_acceptance_file: calibration/wm_acceptance.json
  mode: shadow
  device: cuda
  checkpoint: models/world_model.pt
  record_session: sessions/room_day1_layout_a
robot:
  serial_port: /dev/ttyACM0
  baud: 9600
  track_width_m: 0.18
  footprint_radius_m: 0.18
  pwm_limit: 140
  wheel_command_scale_mps: 0.25
  linear_command_scale_mps: 0.06
  angular_command_scale_rps: 0.15
  physical_speed_bound_mps: 0.10
  physical_angular_speed_bound_rps: 0.40
  min_brake_decel_mps2: 0.20
  min_angular_brake_decel_rps2: 0.80
  actuator_latency_bound_s: 0.15
  # Unmeasured Pi guard bound for the independently enforced MCU cutoff.
  motor_cutoff_bound_s: 0.11
  motor_time_uncertainty_max_s: 0.10
  # Explicit oscillator-rate assumption, not a measured calibration.
  mcu_clock_rate_bound_ppm: 20000.0
camera:
  device: /dev/video0
  width: 640
  height: 480
  requested_fps: 15
  publish_max_fps: 10
  jpeg_quality: 80
  backend: v4l2
  pixel_format: MJPG
  buffer_count: 4
  stall_timeout_s: 2.0
  # Optional named V4L2 controls are set and read back; specify only measured settings.
  controls: {}
  max_capture_age_at_dequeue_s: 1.0
  max_training_exposure_uncertainty_s: 0.10
  timing:
    accepted: false
    timestamp_uncertainty_s: null
    exposure_readout_bound_s: null
    empirical_latency_bound_s: null
    empirical_latency_min_s: 0.0
    evidence_id: ""
  calibration_file: config/camera.json
  intrinsics_file: ""
  already_rectified: false
safety:
  pulse_s: 0.08
  max_frame_age_s: 2.00
  max_response_delay_s: 0.35
  max_inference_s: 0.30
  clearance_margin_m: 0.25
  settle_extra_s: 0.20
  deadman_timeout_s: 0.35
  progress_timeout_s: 20.0
  task_timeout_s: 900.0
  obstacle_speed_bound_mps: 0.0
perception:
  detector_weights: models/yolo11n.pt
  detector_model_id: yolo11n.pt
  depth_model_id: depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf
  # Pin an immutable HF commit for reproducible real data; use the same in label.py.
  depth_model_revision: null
  local_files_only: true
  depth_scale_m: 3.0
  person_standoff_m: 1.0
  movement_horizon_s: 3.0
  target_jump_bearing_rad: 0.30
  target_jump_distance_m: 0.60
planner:
  pulse_s: 0.08
  wait_s: 2.50
  horizon: 3
  uncertainty_limit: 0.12

# Change record_session and these identifiers for each independent condition.
# Never silently alter a session's immutable configuration/manifest.
session:
  session_id: room_day1_layout_a
  layout_id: layout_a
  day_id: day1
  lighting_id: daylight
  operator: unspecified
