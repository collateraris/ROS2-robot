# These override the installed Jazzy nav2_bringup/params/nav2_params.yaml.
# Geometry is EXAMPLE ONLY. Launch robot_radius changes both costmaps and CM circles.
amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    update_min_a: 0.10
    update_min_d: 0.10
    transform_tolerance: 0.3
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    controller_frequency: 10.0
    min_y_velocity_threshold: 0.0
    failure_tolerance: 0.2
    progress_checker:
      required_movement_radius: 0.08
      movement_time_allowance: 15.0
    general_goal_checker:
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.10
      max_vel_y: 0.0
      max_vel_theta: 0.40
      min_speed_xy: 0.0
      max_speed_xy: 0.10
      min_speed_theta: 0.25
      acc_lim_x: 0.20
      acc_lim_y: 0.0
      acc_lim_theta: 0.50
      decel_lim_x: -0.30
      decel_lim_y: 0.0
      decel_lim_theta: -0.60
      vx_samples: 8
      vy_samples: 1
      vtheta_samples: 16
      sim_time: 1.5
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.015
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.10
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 16.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.18
      footprint_padding: 0.03
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 8.0
      publish_frequency: 3.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.05
          obstacle_max_range: 4.0
          raytrace_min_range: 0.05
          raytrace_max_range: 5.0
          expected_update_rate: 0.25
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.18
      footprint_padding: 0.03
      resolution: 0.05
      update_frequency: 2.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.05
          obstacle_max_range: 4.0
          raytrace_min_range: 0.05
          raytrace_max_range: 5.0
          expected_update_rate: 0.25
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 5.0
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    GridBased:
      allow_unknown: false
      tolerance: 0.15
behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    robot_base_frame: base_link
    local_frame: odom
    global_frame: map
    max_rotational_vel: 0.40
    min_rotational_vel: 0.25
    rotational_acc_lim: 0.50
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.10, 0.0, 0.40]
    min_velocity: [-0.05, 0.0, -0.40]
    max_accel: [0.20, 0.0, 0.50]
    max_decel: [-0.30, 0.0, -0.60]
    odom_topic: /odom
    velocity_timeout: 0.30
collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: /room_nav/collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.30
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [StopZone, SlowZone, FootprintApproach]
    StopZone:
      type: circle
      radius: 0.33
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: /room_nav/stop_zone
      enabled: true
    SlowZone:
      type: circle
      radius: 0.48
      action_type: slowdown
      slowdown_ratio: 0.3
      min_points: 1
      visualize: true
      polygon_pub_topic: /room_nav/slow_zone
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.05
      min_points: 1
      visualize: false
      enabled: true
    observation_sources: [scan, range]
    scan:
      type: scan
      topic: /scan
      enabled: true
    range:
      type: range
      topic: /range
      # Angular sampling step of the arc, radians; actual FOV comes from Range message.
      obstacles_angle: 0.017453292519943295
      source_timeout: 0.30
      enabled: false
